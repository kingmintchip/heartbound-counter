<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartbound Counter</title>
<meta name="description" content="Time since Heartbound was funded on Kickstarter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a10;
    --fg: #f2ede4;
    --dim: #8a8494;
    --accent: #ff4d6d;
    --panel: #16141d;
    --border: #2a2634;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "VT323", ui-monospace, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    text-align: center;
    background-image: radial-gradient(circle at 50% 40%, #1d1726 0%, var(--bg) 70%);
  }
  h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(14px, 2.6vw, 26px);
    line-height: 1.6;
    margin: 0 0 32px;
    letter-spacing: 1px;
  }
  h1 .quote { color: var(--accent); }
  .counter {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(8px, 1.6vw, 18px);
    max-width: 1100px;
  }
  .unit {
    background: var(--panel);
    border: 2px solid var(--border);
    padding: clamp(10px, 1.6vw, 18px) clamp(12px, 2vw, 24px);
    min-width: clamp(88px, 14vw, 170px);
  }
  .num {
    font-size: clamp(56px, 11vw, 140px);
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(8px, 1vw, 11px);
    color: var(--dim);
    margin-top: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .total {
    margin-top: 28px;
    font-size: clamp(22px, 3vw, 32px);
    color: var(--dim);
  }
  .total b { color: var(--fg); font-weight: normal; }
  footer {
    margin-top: 40px;
    font-size: 20px;
    color: var(--dim);
    max-width: 640px;
    line-height: 1.3;
  }
  footer .heart { color: var(--accent); }
</style>
</head>
<body>
  <h1>TIME SINCE HEARTBOUND WAS <span class="quote">"RELEASED"</span></h1>

  <div class="counter" aria-live="off">
    <div class="unit"><div class="num" id="years">0</div><div class="label">Years</div></div>
    <div class="unit"><div class="num" id="days">0</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>

  <div class="total">That's <b id="totalDays">0</b> days. Still in Early Access.</div>

  <footer>
    Counting from the end of the Heartbound Kickstarter campaign: March 26, 2017.<br>
    Original target release: December 2017. <span class="heart">&hearts;</span>
  </footer>

<script>
  // Kickstarter funding period ended Mar 26, 2017 (Pacific time). Change here if needed.
  const START = new Date("2017-03-26T00:00:00-07:00");

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  function tick() {
    const now = new Date();

    // Whole calendar years elapsed
    let years = now.getFullYear() - START.getFullYear();
    let anniv = new Date(START);
    anniv.setFullYear(START.getFullYear() + years);
    if (anniv > now) {
      years--;
      anniv = new Date(START);
      anniv.setFullYear(START.getFullYear() + years);
    }

    let rem = Math.floor((now - anniv) / 1000);
    const days = Math.floor(rem / 86400); rem %= 86400;
    const hours = Math.floor(rem / 3600);  rem %= 3600;
    const minutes = Math.floor(rem / 60);
    const seconds = rem % 60;

    $("years").textContent = years;
    $("days").textContent = days;
    $("hours").textContent = pad(hours);
    $("minutes").textContent = pad(minutes);
    $("seconds").textContent = pad(seconds);
    $("totalDays").textContent = Math.floor((now - START) / 86400000).toLocaleString();
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
